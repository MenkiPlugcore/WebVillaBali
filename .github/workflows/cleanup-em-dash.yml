name: Cleanup em dash

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-em-dash.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove em dash characters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          skip_dirs = {'.git', 'node_modules', '.next', 'dist', 'build'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or any(part in skip_dirs for part in path.parts):
                  continue
              try:
                  raw = path.read_bytes()
                  text = raw.decode('utf-8')
              except (UnicodeDecodeError, OSError):
                  continue

              if '—' not in text:
                  continue

              # Prefer normal sentence punctuation for spaced em dashes.
              cleaned = text.replace(' — ', '. ')
              # Any remaining em dash is replaced with a regular hyphen.
              cleaned = cleaned.replace('—', '-')

              if cleaned != text:
                  path.write_text(cleaned, encoding='utf-8')
                  changed.append(str(path))

          print(f'Updated {len(changed)} file(s).')
          for path in changed:
              print(path)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No em dash characters found.'
            exit 0
          fi
          git config user.name 'CADERA Cleanup Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Remove em dash from website copy'
          git push
